<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <link rel="stylesheet" href="../../public/assets/css/inicio.css">
    <title>Módulo de Rampa</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid container-responsive">
            <a href="../../app/views/Index.html" class="navbar-brand">
                <i class="fas fa-eye"></i> 
                <span class="desktop-only">EOLO - Módulo de Rampa</span>
               </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/Index.html">
                            <i class="fas fa-home"></i> 
                            <span class="desktop-only">Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/sub_menu_despacho.html">
                            <i class="fas fa-plane-departure"></i> 
                            <span class="desktop-only">Despacho</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/sub_menu_seguridad.html">
                            <i class="fas fa-eye	"></i> 
                            <span class="desktop-only">Seguridad</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="../../app/views/sub_menu_rampa.html">
                            <i class="fas fa-eye	"></i> 
                            <span class="desktop-only">Rampa</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3 desktop-only" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="desktop-only">Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <h1 class="card-title-main">Módulo de Rampa</h1>
            
            <!-- Información de permisos -->
            <div id="infoPermisos"></div>
            
            <div class="mosaic-grid">
                
                <!-- Pernoctas Diarias -->
                <a href="../../app/views/ver_remision_pipa.html" class="mosaic-card" data-modulo="remision">
                    <i class="fas fa-gas-pump icon"></i>
                    <h4>Remision de pipa</h4>
                    <p>Registro de Remision de pipas</p>
                    <div class="permiso-badge" id="badge-remision">
                    </div>
                </a>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/assets/js/auth_check.js"></script>
    <script src="../../public/assets/js/permisos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!verificarSesion()) return;
            
            // Verificar acceso al módulo de seguridad
            if (!permisosSistema.verificarAccesoPagina('rampa')) {
                return;
            }
            
            permisosSistema.aplicarPermisosUI();
            mostrarInfoUsuario();
        });
        
        function mostrarInfoUsuario() {
            // Mostrar en navbar
            const userInfo = document.getElementById('userInfo');
            if (userInfo) {
                userInfo.innerHTML = `
                    <i class="fas fa-user me-1"></i>
                    ${permisosSistema.usuario.nombre || 'Usuario'}
                    <small class="badge bg-light text-dark ms-1">
                        ${permisosSistema.usuario.tipo === 'admin' ? 'Admin' : 'Usuario'}
                    </small>
                `;
            }
            
            // Mostrar en footer
            const footerUser = document.getElementById('footerUserName');
            if (footerUser) {
                footerUser.textContent = permisosSistema.usuario.nombre || 'Usuario';
            }
        }
    </script>
</body>
</html>
