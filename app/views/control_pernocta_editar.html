<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <script src="../../public/assets/js/auth_check.js"></script>
    <title>Editar Control de Pernocta</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid container-responsive">
            <a href="../../app/views/Index.html" class="navbar-brand">
                <i class="fas fa-plane"></i> 
                <span class="desktop-only">EOLO - Editar Control</span>
                <span class="mobile-only">EOLO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/ver_pernocta_diaria.html">
                            <i class="fas fa-bed"></i> 
                            <span class="desktop-only">Pernoctas Diarias</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/ver_control_pernoctas.html">
                            <i class="fas fa-clipboard-list"></i> 
                            <span class="desktop-only">Control Pernoctas</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3 desktop-only" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="desktop-only">Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Formulario de Edición de Control -->
    <div class="container-fluid container-responsive mt-4">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="fas fa-edit"></i> Editar Control de Pernocta</h5>
            </div>
            <div class="card-body">
                <form id="controlPernoctaForm">
                    <input type="hidden" id="id_control" name="id_control">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Matrícula:</label>
                                <input type="text" class="form-control" id="matricula" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Equipo:</label>
                                <input type="text" class="form-control" id="equipo" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label">Fecha:</label>
            <input type="date" class="form-control" id="fecha" name="fecha" required>
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label">Hora Inicial:</label>
            <input type="time" class="form-control" id="hora_inicial" name="hora_inicial" required>
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label">Hora Final:</label>
            <input type="time" class="form-control" id="hora_final" name="hora_final" required>
        </div>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <div class="form-group">
            <label for="hangar" class="form-label">Hangar:</label>
            <select class="form-select" id="hangar" name="hangar" required>
                <option value="">Seleccione hangar</option>
                <option value="H1">H1</option>
                <option value="H2">H2</option>
            </select>
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group">
            <label for="persona_registro" class="form-label">Persona que Registra:</label>
            <input type="text" class="form-control" id="persona_registro" name="persona_registro" 
                   required placeholder="Nombre de la persona que realiza el registro">
        </div>
    </div>
</div>

<div class="row mb-3">
    <div class="col-12">
        <div class="form-group">
            <label for="empresa_procedencia" class="form-label">Empresa/Procedencia:</label>
            <input type="text" class="form-control" id="empresa_procedencia" name="empresa_procedencia" 
                   placeholder="Ingrese empresa o procedencia...">
        </div>
    </div>
</div>

<div class="row mb-3">
    <div class="col-12">
        <div class="form-group">
            <label for="observaciones" class="form-label">Observaciones:</label>
            <textarea class="form-control" id="observaciones" name="observaciones" 
                      rows="3" placeholder="Ingrese observaciones..."></textarea>
        </div>
    </div>
</div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" class="btn btn-secondary me-md-2" onclick="cancelarEdicion()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-warning" id="submitButton">
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                            Actualizar Control
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel">
                        <i class="fas fa-check-circle me-2"></i>¡Éxito! 🎉
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="successModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="errorModalLabel">
                        <i class="fas fa-exclamation-triangle me-2"></i>¡Error! ⚠️
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="errorModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/assets/js/control_pernocta.js"></script>
    <script src="../../public/assets/js/auth_check.js"></script>
    <script src="../../public/assets/js/permisos.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!verificarSesion()) return;
        
        // Verificar acceso al módulo
        if (!permisosSistema.verificarAccesoPagina('control_pernoctas')) {
            return;
        }
        
        permisosSistema.aplicarPermisosUI();
        
        // Verificar si estamos en modo agregar
        const urlParams = new URLSearchParams(window.location.search);
        const modoAgregar = urlParams.get('agregar');
        const idAeronave = urlParams.get('id_aeronave');
        
        if (modoAgregar === 'true' && idAeronave) {
            console.log('➕ Modo AGREGAR activado para aeronave:', idAeronave);
            inicializarModoAgregar(urlParams);
            
            // ✅ EVITAR que se ejecute la carga normal de control_pernocta.js
            // Podemos hacer esto deshabilitando temporalmente la función
            window.cargarControlParaEdicion = function() {
                console.log('⏸️ Carga de control deshabilitada - Modo agregar activo');
                return Promise.resolve();
            };
            
        } else {
            console.log('📝 Modo EDICIÓN normal');
            // La inicialización normal se hace en control_pernocta.js
        }
    });

</script>
</body>
</html>
