<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <script src="../../public/assets/js/auth_check.js"></script>
    <title>Gestión de Remisiones</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid container-responsive">
            <a href="../../app/views/Index.html" class="navbar-brand">
                <i class="fas fa-plane"></i> 
                <span class="desktop-only">EOLO - Sistema de Remisión</span>
                <span class="mobile-only">EOLO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    
                    <li class="nav-item">
                        <a class="nav-link active" href="../../app/views/ver_remision_pipa.html">
                            <i class="fas fa-gas-pump"></i> 
                            <span class="desktop-only">Remisiones</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3 desktop-only" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="desktop-only">Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid container-responsive">
        <div class="container-form mt-3">
            <h2 class="form-title responsive-text">
                <i class="fas fa-bed"></i> Gestión de Remisiones</h2>
        </div>

        <!-- Información de permisos -->
        <div id="infoPermisos"></div>

        <div class="mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-responsive">
    <h3 class="form-title mb-0 responsive-text">
        <i class="fas fa-list-ul"></i> 
        <span class="d-none d-md-inline">Lista de Remisiones</span>
        <span class="d-md-none">Remisones</span>
    </h3>


    <!-- Botón condicional según permisos -->
    <a href="../../app/views/remision.html" class="btn btn-success btn-crear" data-modulo="remision">
        <i class="fas fa-plus"></i> 
        <span class="d-none d-md-inline">Agregar Registro</span>
        <span class="d-md-none">Agregar</span>
    </a>
</div>

            <!-- Filtros de búsqueda - VERSIÓN RESPONSIVA -->
<div class="row mb-3">
    <!-- Filtro Fecha -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-2">
        <div class="form-group">
            <label for="filtroFecha" class="form-label">Filtrar por fecha:</label>
            <input type="date" id="filtroFecha" class="form-control">
        </div>
    </div>
    
    <!-- Filtro Matrícula -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-2">
        <div class="form-group">
            <label for="filtroMatricula" class="form-label">Filtrar por matrícula:</label>
            <input type="text" id="filtroMatricula" class="form-control" placeholder="Matrícula...">
        </div>
    </div>
    
    
    
    <!-- Botones de Acción -->
    <div class="col-12 col-sm-6 col-md-12 col-lg-3 mb-2 d-flex align-items-end">
        <div class="d-grid d-md-flex gap-2 w-100">
            <button class="btn btn-primary flex-fill" onclick="aplicarFiltros()">
                <i class="fas fa-search me-1"></i> 
                <span class="d-none d-sm-inline"></span>
            </button>
            <button class="btn btn-secondary flex-fill" onclick="limpiarFiltros()">
                <i class="fas fa-undo me-1"></i>
                <span class="d-none d-sm-inline"></span>
            </button>
        </div>
    </div>
</div>

            <!-- Indicador de scroll para móviles -->
            <div class="scroll-hint mobile-only">
                <i class="fas fa-arrows-left-right"></i> Desliza para ver más información
            </div>

            <div class="table-responsive container-responsive">
                <div class="table-responsive-custom">
                    <table class="table table-striped table-hover" id="tablaRemisiones">
                        <thead class="table-dark">
                            <tr>
                                <th class="mobile-compact">Fecha</th>
                                <th>Matrícula</th>
                                <th>Equipo</th>
                                <th class="mobile-compact">No.Remisión</th>
                                <th class="desktop-only">Totalizador Inicial</th>
                                <th class="desktop-only">Totalizador Final</th>
                                <th class="desktop-only">Total Litros</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaRemisiones">
                            <!-- Los datos se cargarán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="paginador" class="mt-3 paginador-container"></div>
        </div>
    </div>
       
    <!-- Modal de éxito -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel">
                        <i class="fas fa-check-circle me-2"></i>¡Éxito! 🎉
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="successModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de error -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="errorModalLabel">
                        <i class="fas fa-exclamation-triangle me-2"></i>¡Error! ⚠️
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="errorModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="confirmModalLabel">
                        <i class="fas fa-question-circle me-2"></i>Confirmar
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning" id="confirmActionBtn">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../public/assets/js/remision.js"></script>
    <script src="../../public/assets/js/auth_check.js"></script>
    <script src="../../public/assets/js/permisos.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!verificarSesion()) return;
        
        // Verificar acceso al módulo
        if (!permisosSistema.verificarAccesoPagina('remision')) {
            return;
        }
        
        permisosSistema.aplicarPermisosUI();
    });
</script>
</body>
</html>
