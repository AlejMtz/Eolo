<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <script src="../../public/assets/js/auth_check.js"></script>
    <title>Editar Asignación de Mantenimiento</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid container-responsive">
            <a href="../../app/views/Index.html" class="navbar-brand">
                <i class="fas fa-tools"></i> 
                <span class="desktop-only">EOLO - Editar Asignación</span>
                <span class="mobile-only">EOLO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../../app/views/ver_asignacion_mantenimiento.html">
                            <i class="fas fa-clipboard-list"></i> 
                            <span class="desktop-only">Asignaciones</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3 desktop-only" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="desktop-only">Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Formulario de Edición de Asignación -->
    <div class="container-fluid container-responsive mt-4">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="fas fa-edit"></i> Editar Asignación de Mantenimiento</h5>
            </div>
            <div class="card-body">
                <form id="asignacionForm">
                    <input type="hidden" id="id_asignacion" name="id_asignacion">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Matrícula:</label>
                                <input type="text" class="form-control" id="matricula" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Equipo:</label>
                                <input type="text" class="form-control" id="equipo" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Fecha:</label>
                                <input type="date" class="form-control" id="fecha" name="fecha" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Hora:</label>
                                <input type="time" class="form-control" id="hora" name="hora" required>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="tipo_cliente" class="form-label">Tipo de Cliente:</label>
                                <select class="form-select" id="tipo_cliente" name="tipo_cliente" required>
                                    <option value="">Seleccione tipo de cliente</option>
                                    <option value="Guarda">Guarda</option>
                                    <option value="Transito">Transito</option>
                                    <option value="Aerotaxi">Aerotaxi</option>
                                    <option value="Handling">Handling</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="tipo_mantenimiento" class="form-label">Tipo de Mantenimiento:</label>
                                <select class="form-select" id="tipo_mantenimiento" name="tipo_mantenimiento" required>
                                    <option value="">Seleccione tipo de mantenimiento</option>
                                    <option value="0">Mantenimiento 0</option>
                                    <option value="1">Mantenimiento 1</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" class="btn btn-secondary me-md-2" onclick="cancelarEdicion()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-warning" id="submitButton">
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                            Actualizar Asignación
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel">
                        <i class="fas fa-check-circle me-2"></i>¡Éxito! 🎉
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="successModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="errorModalLabel">
                        <i class="fas fa-exclamation-triangle me-2"></i>¡Error! ⚠️
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="errorModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../public/assets/js/asignacion_mantenimiento.js"></script>
    <script src="../../public/assets/js/auth_check.js"></script>
    <script src="../../public/assets/js/permisos.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!verificarSesion()) return;
        
        // Verificar acceso al módulo
        if (!permisosSistema.verificarAccesoPagina('asignacion_mantenimiento')) {
            return;
        }
        
        permisosSistema.aplicarPermisosUI();
        
        // Verificar si estamos en modo agregar
        const urlParams = new URLSearchParams(window.location.search);
        const modoAgregar = urlParams.get('agregar');
        const idAeronave = urlParams.get('id_aeronave');
        
        if (modoAgregar === 'true' && idAeronave) {
            console.log('➕ Modo AGREGAR activado para aeronave:', idAeronave);
            inicializarModoAgregar(urlParams);
            
            // ✅ EVITAR que se ejecute la carga normal
            window.cargarAsignacionParaEdicion = function() {
                console.log('⏸️ Carga de asignación deshabilitada - Modo agregar activo');
                return Promise.resolve();
            };
            
        } else {
            console.log('📝 Modo EDICIÓN normal');
            // La inicialización normal se hace en asignacion_mantenimiento.js
        }
    });
    </script>
</body>
</html>
